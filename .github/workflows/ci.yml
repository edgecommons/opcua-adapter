name: ci

on:
  push:
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']

jobs:
  ci:
    # Reusable component CI from the org defaults repo.
    permissions:
      contents: read
      packages: read   # resolve com.mbreissi:ggcommons from GitHub Packages (edgecommons)
    uses: edgecommons/.github/.github/workflows/component-ci.yml@main
    with:
      language: JAVA
    secrets: inherit
