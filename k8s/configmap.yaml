# Component config for Kubernetes, mounted as a DIRECTORY at /etc/ggcommons so the CONFIGMAP
# source watches the kubelet ..data swap and hot-reloads in-process (no restart). config.json
# carries BOTH the component config AND the messaging block (in-cluster broker via Service DNS).
# Edit this and `kubectl apply -f k8s/` to drive a hot reload. Point host at your broker Service.
apiVersion: v1
kind: ConfigMap
metadata:
  name: OpcUaAdapter-config
  labels:
    app.kubernetes.io/name: OpcUaAdapter
data:
  config.json: |-
    {
      "messaging": {
        "local": { "type": "mqtt", "host": "emqx.default.svc.cluster.local", "port": 1883, "clientId": "OpcUaAdapter" }
      },
      "logging": { "level": "INFO" },
      "metricEmission": { "target": "prometheus" },
      "component": {
        "global": { "defaults": { "publishIntervalMs": 1000, "samplingRateMs": 500, "queueSize": 100 } },
        "instances": [
          {
            "id": "device-1",
            "adapter": "opcua",
            "connection": { "endpoint": "opc.tcp://opcua.default.svc.cluster.local:4840/", "securityPolicy": "None" },
            "publish": { "topic": "southbound/{ComponentName}/{InstanceId}/{tagId}", "batchMs": 1000 },
            "subscriptions": [
              { "id": "all", "include": [ { "namespace": 0, "match": ".*" } ] }
            ]
          }
        ]
      }
    }
