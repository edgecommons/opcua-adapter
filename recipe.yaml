---
RecipeFormatVersion: "2020-01-25"
ComponentName: "com.mbreissi.edgecommons.OpcUaAdapter"
ComponentVersion: "1.0.0"
ComponentDescription: "OPC UA -> Greengrass southbound adapter (Eclipse Milo)"
ComponentPublisher: "Marc Breissinger"
ComponentDependencies:
  aws.greengrass.TokenExchangeService:
    VersionRequirement: ">=2.0.0"
    DependencyType: "HARD"
ComponentConfiguration:
  DefaultConfiguration:
    ComponentConfig:
      logging:
        level: "INFO"
        java_format: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%-5p] %C{1} (%L) [%t] : %m%n"
      heartbeat:
        intervalSecs: 5
        destination: "local"
        measures:
          cpu: true
          memory: true
          disk: false
          fds: true
          files: true
      # UNS enterprise hierarchy (last level = the device = thing name). A deployment overrides
      # `identity` with the site/shop/line values for the target device/group.
      hierarchy:
        levels: ["site", "shop", "line", "device"]
      identity:
        site: "site1"
        shop: "shop1"
        line: "line1"
      tags: {}
      metricEmission:
        target: "log"
        targetConfig:
          logFileName: "/greengrass/v2/logs/{ComponentFullName}.metric.log"
      component:
        global: {}
        instances: []
    accessControl:
      aws.greengrass.ipc.pubsub:
        "com.mbreissi.edgecommons.OpcUaAdapter:ipc:1":
          policyDescription: Allows access to publish/subscribe to all topics on IPC
          operations:
            - "aws.greengrass#PublishToTopic"
            - "aws.greengrass#SubscribeToTopic"
          resources:
            - "*"
      aws.greengrass.ipc.mqttproxy:
        "com.mbreissi.edgecommons.OpcUaAdapter:iotcore:1":
          policyDescription: Allows access to publish/subscribe to all topics on IoT Core.
          operations:
            - "aws.greengrass#PublishToIoTCore"
            - "aws.greengrass#SubscribeToIoTCore"
          resources:
            - "*"
      aws.greengrass.ShadowManager:
        "com.mbreissi.edgecommons.OpcUaAdapter:shadow:1":
          policyDescription: Allows access to shadows.
          operations:
            - 'aws.greengrass#GetThingShadow'
            - 'aws.greengrass#UpdateThingShadow'
            - 'aws.greengrass#DeleteThingShadow'
          resources:
            - "*"
Manifests:
  - Platform:
      os: all
    Artifacts:
      - URI: "s3://BUCKET_NAME/COMPONENT_NAME/COMPONENT_VERSION/opcua-adapter-1.0.0.jar"
    Lifecycle:
      # Runs as the default component user (ggc_user) — no elevated privilege needed (GG IPC,
      # TES-backed AWS, and the work dir are all accessible unprivileged). Add RequiresPrivilege
      # only if your component genuinely requires root.
      Run:
        Setenv:
          CONFIG: "{configuration:/ComponentConfig}"
        Script:
          "java -cp {artifacts:path}/opcua-adapter-1.0.0.jar com.mbreissi.edgecommons.opcua.OpcUaAdapter --platform GREENGRASS"